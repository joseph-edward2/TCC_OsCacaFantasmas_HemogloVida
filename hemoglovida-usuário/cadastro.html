<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hemoglovida — Crie sua conta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Ícones: biblioteca Phosphor (única fonte de ícones usada no projeto) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body>

  <!-- Navbar na variante "auth": só a logo, sem botão "Doar Agora" -->
  <div id="navbar-placeholder" data-variant="auth"></div>

  <main class="auth">

    <!-- ===================== COLUNA ESQUERDA ===================== -->
    <div class="auth__illustration">
      <div class="auth__illustration-img"></div>
      <p class="auth__illustration-quote">Seu sangue salva vidas</p>
    </div>

    <!-- ===================== COLUNA DIREITA (FORMULÁRIO) ===================== -->
    <div class="auth__form-side">
      <div class="auth-card">
        <h1 class="auth-card__title">Crie sua conta</h1>
        <p class="auth-card__subtitle">
          Junte-se à nossa comunidade de heróis e comece a salvar vidas hoje.
        </p>

        <form id="cadastro-form" novalidate>

          <!-- E-mail -->
          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <div class="form-input-wrapper">
              <span class="form-input-icon">
                <i class="ph ph-envelope-simple"></i>
              </span>
              <input class="form-input" type="email" id="email" name="email" placeholder="exemplo@email.com" required />
            </div>
          </div>

          <!-- CPF -->
          <div class="form-group">
            <label class="form-label" for="cpf">CPF</label>
            <div class="form-input-wrapper">
              <span class="form-input-icon">
                <i class="ph ph-identification-card"></i>
              </span>
              <input class="form-input" type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" required />
            </div>
          </div>

          <!-- Tipo Sanguíneo -->
          <div class="form-group">
            <label class="form-label" for="tipo-sanguineo">Tipo Sanguíneo</label>
            <div class="form-input-wrapper">
              <span class="form-input-icon">
                <i class="ph ph-drop"></i>
              </span>
              <select class="form-select" id="tipo-sanguineo" name="tipo-sanguineo" required>
                <option value="" selected disabled>Selecione seu tipo</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>

          <!-- Senha + Confirmar Senha -->
          <div class="form-group form-group--split">
            <div>
              <label class="form-label" for="senha">Senha</label>
              <div class="form-input-wrapper">
                <span class="form-input-icon">
                  <i class="ph ph-lock"></i>
                </span>
                <input class="form-input" type="password" id="senha" name="senha" placeholder="••••••••" required />
                <button type="button" class="form-toggle-visibility" data-target="senha" aria-label="Mostrar ou ocultar senha">
                  <i class="ph ph-eye"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="form-label" for="confirmar-senha">Confirmar Senha</label>
              <div class="form-input-wrapper">
                <span class="form-input-icon">
                  <i class="ph ph-lock"></i>
                </span>
                <input class="form-input" type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••" required />
                <button type="button" class="form-toggle-visibility" data-target="confirmar-senha" aria-label="Mostrar ou ocultar senha">
                  <i class="ph ph-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Gênero -->
          <div class="form-group">
            <label class="form-label">Gênero</label>
            <div class="segmented">
              <div class="segmented__option is-active" data-value="masculino">Masculino</div>
              <div class="segmented__option" data-value="feminino">Feminino</div>
              <div class="segmented__option" data-value="outro">Outro</div>
            </div>
          </div>

          <!-- Telefone -->
          <div class="form-group">
            <label class="form-label" for="telefone">Telefone</label>
            <div class="form-input-wrapper">
              <span class="form-input-icon">
                <i class="ph ph-phone"></i>
              </span>
              <input class="form-input" type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" required />
            </div>
          </div>

          <!-- Termos -->
          <div class="form-terms">
            <input type="checkbox" id="terms" name="terms" />
            <label for="terms">
              Li e aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>.
            </label>
          </div>

          <!-- Botão -->
          <button type="submit" class="btn btn-primary">
            Criar conta
            <i class="ph ph-arrow-right"></i>
          </button>
        </form>

        <p class="auth-card__footer">
          Já tem uma conta? <a href="login.html">Entrar agora</a>
        </p>
      </div>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
