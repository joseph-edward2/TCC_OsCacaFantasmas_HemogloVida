<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hemoglovida — Encontrar Hemocentro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/local.css" />
</head>
<body>

  <!-- Navbar na variante "app", com "Agendamentos" ativo (essa tela faz
       parte do mesmo fluxo de escolher onde agendar a doação) -->
  <div id="navbar-placeholder" data-variant="app" data-active="agendamentos"></div>

  <main class="local-main">
    <div class="container">

      <div class="search-bar">
        <div class="search-input">
          <span class="ic">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar cidade, bairro ou hemocentro...">
        </div>
        <select id="bloodFilter">
          <option value="">Tipo Sanguíneo</option>
          <option>O-</option>
          <option>O+</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>
      </div>

      <div class="content-grid">
        <div class="list-col" id="listCol"></div>

        <div class="map-col">
          <div class="map-frame" id="mapFrame">
            <svg class="map-svg" viewBox="0 0 700 760" preserveAspectRatio="xMidYMid slice">
              <rect width="700" height="760" fill="#eef1ea"/>
              <rect x="0" y="120" width="700" height="26" fill="#dfe3d8"/>
              <rect x="60" y="0" width="18" height="760" fill="#e3dfc9"/>
              <rect x="330" y="0" width="14" height="760" fill="#e3dfc9"/>
              <rect x="0" y="420" width="700" height="16" fill="#e3dfc9"/>
              <rect x="0" y="600" width="700" height="14" fill="#e3dfc9"/>
              <rect x="520" y="0" width="14" height="760" fill="#e3dfc9"/>
              <polygon points="140,0 260,0 190,760 60,760" fill="#e7ded0" opacity=".6"/>
              <circle cx="150" cy="200" r="60" fill="#dcead9"/>
              <circle cx="560" cy="560" r="90" fill="#dcead9"/>
              <rect x="330" y="120" width="220" height="18" fill="#c9d4e8"/>
              <text x="345" y="112" font-size="20" font-weight="700" fill="#3d3d40" font-family="Inter, sans-serif">116</text>
            </svg>
            <div class="map-pins" id="mapPins"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <div class="toast" id="toast"></div>

  <script src="js/components.js"></script>
  <script src="js/local.js"></script>
</body>
</html>
