<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hemoglovida — Encontrar Hemocentro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Mapa: Leaflet + OpenStreetMap (mesmo usado na Home) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Ícones: biblioteca Phosphor (única fonte de ícones usada no projeto) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/local.css" />
</head>
<body>

  <!-- Navbar na variante "app", com "Agendamentos" ativo (essa tela faz
       parte do mesmo fluxo de escolher onde agendar a doação) -->
  <div id="navbar-placeholder" data-variant="app" data-active="agendamentos"></div>

  <main class="page-main local-main">
    <div class="container">

      <div class="search-bar">
        <div class="search-input">
          <span class="ic"><i class="ph ph-magnifying-glass"></i></span>
          <input type="text" id="searchInput" placeholder="Buscar cidade, bairro ou hemocentro...">
        </div>
        <select id="bloodFilter">
          <option value="">Tipo Sanguíneo</option>
          <option>O-</option>
          <option>O+</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>
      </div>

      <div class="content-grid">
        <div class="list-col" id="listCol"></div>

        <div class="map-col">
          <div class="map-frame" id="mapFrame">
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <div class="toast" id="toast"></div>

  <script src="js/components.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/local.js"></script>
</body>
</html>
