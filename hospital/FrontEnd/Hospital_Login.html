<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemoglovida | Hemocentro</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <!--Título e logo-->
    <div class="header-left">
      <div class="logo">
         <img src="https://i.ibb.co/SwCGm0fj/Hemoglovida-Logo.png" alt="Logo Hemoglovida" class="logo-icon">
        Hemoglovida
      </div>
    </div>
  </header>

  <!-- Corpo -->
  <main class="page">

    <!-- Bloco de identidade -->
    <section class="hero">
      <div class="hero__row">
        <div class="hero__badge">
          <img class="hero__logo" src="assets/logo.png" alt="Logo Hemoglovida">
        </div>
        <h1 class="hero__name">Hemoglovida</h1>
      </div>
      <h2 class="hero__subtitle">Hospital</h2>
    </section>

    <!-- Cartão de login -->
    <section class="card">
      <form id="loginForm" method="POST" novalidate>
        <div class="field">
          <label class="field__label" for="login">Login</label>
          <input
            class="field__input"
            type="text"
            id="login"
            name="login"
            placeholder="00.000.000/0001-00"
            autocomplete="username"
            maxlength="18"
            inputmode="numeric">
        </div>

        <div class="field">
          <label class="field__label" for="senha">Senha</label>
          <div class="field__wrapper">
            <input
              class="field__input field__input--password"
              type="password"
              id="senha"
              name="senha"
              placeholder="••••••••"
              autocomplete="current-password">
            <button type="button" class="field__toggle" id="toggleSenha" aria-label="Mostrar senha">
              <i class="ph ph-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn">Entrar</button> 
      </form>

      <p class="msg" id="msg" hidden>
      </p>
     
    </section>

  </main>
  <script src="js/login.js"></script>
  <script src="base.js"></script>


</body>
</html>
