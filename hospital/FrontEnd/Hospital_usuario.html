<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemoglovida — Minha Conta</title>
<link rel="stylesheet" href="css/usuario.css">
<link rel="stylesheet" href="base.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>
 <header>
    <!--Título e logo-->
    <div class="header-left">
      <div class="logo">
         <img src="https://i.ibb.co/SwCGm0fj/Hemoglovida-Logo.png" alt="Logo Hemoglovida" class="logo-icon">
        Hemoglovida
      </div>

      <!--Links da navbar-->
      <nav>
        <a href="Hospital_estoque.html" class="active">Estoque</a>
        <a href="Hospital_pedidos.html">Pedidos</a>
      </nav>
    </div>

    <!--Ícone de usuário-->
    <div class="user">
      Bem-vindo, Renato Gonçalves
      <a href="Hospital_usuario.html">
      <div class="avatar">
        <img src="assets/avatar.jpg" alt="Foto de perfil">
      </div>
      </a>
    </div>
  </header>

<main>
  <div class="profile-head">
    <div class="profile-photo">
      <img src="assets/avatar.jpg" alt="Foto de perfil" id="profileImg">
      <button class="photo-edit" id="photoEditBtn"><i class="ph ph-camera"></i></button>
    </div>
    <div>
      <h1>Minha Conta</h1>
      <p class="profile-name">Renato Gonçalves</p>
      <a href="#" class="edit-photo-link" id="editPhotoLink">Editar Foto</a>
    </div>
  </div>

  <!-- DADOS PESSOAIS -->
  <section class="panel">
    <h2>Dados Pessoais</h2>
  <div class="grid-2">

      <div class="field">
        <label>Nome Completo</label>
        <input type="text" id="fullName" value="Renato Gonçalves" disabled>
     </div>

      <div class="field">
        <label>Código de Registro</label>
        <input type="text" id="registrationCode" value="76394-SP" disabled>
      </div>

      <div class="field">
        <label>Cargo</label>
        <input type="text" id="role" value="Médico-chefe" disabled>
     </div>

      <div class="field">
        <label>E-mail</label>
        <div class="input-with-btn">
            <span class="ic">
                <i class="ph ph-envelope-simple"></i>
            </span>
            <input type="email" id="emailField" value="renatao@email.com" disabled>
            <button class="btn-alterar" data-target="emailField">
                Alterar
            </button>
        </div>
    </div>

    <div class="field">
        <label>Telefone</label>
        <div class="input-with-btn">
            <span class="ic">
                <i class="ph ph-phone"></i>
            </span>
            <input type="text" id="phoneField" value="(11) 96753-2015" disabled>
            <button class="btn-alterar" data-target="phoneField">
                Alterar
            </button>
        </div>
    </div>

</div>
  </section>

  <!-- SENHA -->
  <section class="panel">
    <h2>Senha</h2>
    <div class="field">
      <label>Senha</label>
      <div class="input-with-btn">
        <input type="password" value="senha1234" id="passwordField" disabled>
        <span class="hint">Última alteração há 45 dias</span>
        <button class="btn-solid" id="changePasswordBtn">Alterar Senha</button>
      </div>
    </div>
  </section>

  <div class="bottom-actions">
    <button class="btn-solid" id="saveBtn">Salvar Alterações</button>
    <button class="btn-solid" id="cadastrofun">Cadastro Funcionário</button>


    <button class="btn-outline-danger" id="deleteAccountBtn">
      <i class="ph ph-prohibit"></i> Encerrar Conta
    </button>

  </div>
</main>

<!-- MODAL ALTERAR SENHA -->
<div class="overlay" id="passwordOverlay">
  <div class="modal">
    <button class="close" id="passwordClose"><i class="ph ph-x"></i></button>
    <h2>Alterar Senha</h2>
    <div class="field">
      <label>Senha atual</label>
      <input type="password" id="currentPass" placeholder="Digite sua senha atual">
    </div>
    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="newPass" placeholder="Digite a nova senha">
    </div>
    <div class="field">
      <label>Confirmar nova senha</label>
      <input type="password" id="confirmPass" placeholder="Repita a nova senha">
    </div>
    <button class="btn-solid full" id="savePasswordBtn">Salvar Nova Senha</button>
  </div>
</div>

<!-- MODAL ENCERRAR CONTA -->
<div class="overlay" id="deleteOverlay">
  <div class="modal">
    <button class="close" id="deleteClose"><i class="ph ph-x"></i></button>

    <div class="modal-icon"><i class="ph ph-warning"></i></div>
    <h2>Encerrar Conta</h2>
    <p class="modal-text">Essa ação é permanente e removerá seu acesso ao painel do hemocentro. Tem certeza que deseja continuar?</p>

    <div class="modal-actions">
      <button class="btn-danger" id="cancelDelete">Cancelar</button>
      <button class="btn-outline-danger" id="confirmDelete">Encerrar conta</button>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script src="base.js"></script>
<script src="js/usuario.js"></script>
</body>
</html>
