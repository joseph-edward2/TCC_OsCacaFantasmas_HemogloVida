<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hemoglovida — Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>

  <link rel="stylesheet" href="../../css/usuario/variables.css" />
  <link rel="stylesheet" href="../../css/usuario/base.css" />
  <link rel="stylesheet" href="../../css/usuario/components.css" />
  <link rel="stylesheet" href="../../css/usuario/auth.css" />
  <link rel="stylesheet" href="../../css/usuario/login.css" />
</head>
<body>

  <div id="navbar-placeholder" data-variant="auth"></div>

  <main class="auth">

    <div class="auth__illustration">
      <div class="auth__illustration-img"></div>
      <p class="auth__illustration-quote">Seu sangue salva vidas</p>
    </div>

    <div class="auth__form-side">
      <div class="auth-card">
        <h1 class="auth-card__title">Bem-vindo de volta</h1>
        <p class="auth-card__subtitle">
          Acesse sua conta para gerenciar suas doações.
        </p>

        <form id="login-form" novalidate>

          <div class="form-group">
            <label class="form-label" for="cpf-telefone">CPF ou telefone</label>
            <div class="form-input-wrapper">
              <input class="form-input form-input--icon-right" type="text" id="cpf-telefone" name="cpf-telefone" placeholder="000.000.000-00" inputmode="numeric" required />
              <span class="form-decorative-icon">
                <i class="ph ph-user"></i>
              </span>
            </div>
          </div>

          <div class="form-group">
            <div class="form-label__row">
              <label class="form-label" for="senha">Senha</label>
              <a href="recuperar-senha.html" class="form-link">Esqueci minha senha</a>
            </div>
            <div class="form-input-wrapper">
              <input class="form-input form-input--icon-right" type="password" id="senha" name="senha" placeholder="••••••••" required />
              <button type="button" class="form-toggle-visibility" data-target="senha" aria-label="Mostrar ou ocultar senha">
                <i class="ph ph-eye"></i>
              </button>
            </div>
          </div>


          <button type="submit" class="btn btn-primary" >
            Entrar
            <i class="ph ph-arrow-right"></i>
          </button>
        </form>

        <p class="auth-card__footer">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="../../js/usuario/components.js"></script>
  <script src="../../js/usuario/masks.js"></script>
  <script src="../../js/usuario/password-toggle.js"></script>
  <script src="../../js/usuario/login.js"></script>
</body>
</html>
