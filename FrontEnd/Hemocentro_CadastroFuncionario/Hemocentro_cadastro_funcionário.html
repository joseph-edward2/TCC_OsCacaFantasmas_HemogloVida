<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemoglovida | Cadastro de Funcionário</title>
  <!-- CSS base (cores, reset, header, footer) — sempre importar ANTES do CSS da página -->
  <link rel="stylesheet" href="../base.css">
  <!-- CSS específico desta tela (estilos do card, campos, etc.) -->
  <link rel="stylesheet" href="css/cadastro-funcionario.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>

  <!-- ====================================================
       CABEÇALHO
       ====================================================
       Mesmo header simplificado da tela de Login: só logo
       e nome do sistema, sem menu de navegação.
       ==================================================== -->
  <header>
    <div class="header-left">
      <div class="logo">
        <img src="../assets/logo.png" alt="Logo Hemoglovida" class="logo-icon">
        Hemoglovida
      </div>
      <nav>
        <a href="Hem_Tela_Inicial.html">Visão Geral</a>
        <a href="Hem_Atendimento.html">Atendimento</a>
        <a href="Hem_Estoque.html">Estoque</a>
        <a href="Hem_Agendamento.html">Agendamentos</a>
        <a href="#">Pedidos</a>
        <a href="#">Alertas</a>
      </nav>
    </div>
    <div class="user">
      <i class="ph ph-gear" href="#"></i>
      Bem-vindo, Dr. Walter White
      <div class="avatar">
        <img src="../assets/usuario.png" alt="Foto de perfil">
      </div>
    </div>
  </header>

  <!-- ====================================================
       CONTEÚDO PRINCIPAL
       ==================================================== -->
  <main class="page">

    <!-- Bloco de identidade (logo grande + nome) -->
    <section class="hero">
      <div class="hero__row">
        <div class="hero__badge">
          <img class="hero__logo" src="../assets/logo.png" alt="Logo Hemoglovida">
        </div>
        <h1 class="hero__name">Hemoglovida</h1>
      </div>
      <h2 class="hero__subtitle">Cadastro de Funcionário</h2>
    </section>

    <!-- ====================================================
         CARTÃO DO FORMULÁRIO
         ====================================================
         Contém todos os campos para cadastrar um funcionário
         do hemocentro. NÃO envia dados pra nenhuma API — é
         apenas o formulário visual (HTML + CSS).
         ==================================================== -->
    <section class="card">
      <h3 class="card__title">Preencha os dados do funcionário</h3>

      <form id="cadastroFuncionarioForm" method="POST" novalidate>

        <!-- CAMPO 1: Nome do Funcionário -->
        <div class="field">
          <label class="field__label" for="nome_funcionario">Nome do Funcionário</label>
          <input
            class="field__input"
            type="text"
            id="nome_funcionario"
            name="nome_funcionario"
            placeholder="Digite o nome completo"
            required>
        </div>

        <!-- CAMPO 2: Senha -->
        <!-- Usa o mesmo padrão da tela de Login: input dentro de .field__wrapper
             com botão de mostrar/ocultar senha posicionado à direita. -->
        <div class="field">
          <label class="field__label" for="senha_funcionario">Senha</label>
          <div class="field__wrapper">
            <input
              class="field__input field__input--password"
              type="password"
              id="senha_funcionario"
              name="senha_funcionario"
              placeholder="••••••••"
              autocomplete="new-password">
            <button type="button" class="field__toggle" id="toggleSenha" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- CAMPO 3: Código de Registro -->
        <!-- É o número que vincula o funcionário ao CNES do estabelecimento.
             O sistema usará esse código pra identificar a qual hemocentro
             ou hospital o funcionário pertence. -->
        <div class="field">
          <label class="field__label" for="codigo_registro_funcionario">Código de Registro</label>
          <input
            class="field__input"
            type="text"
            id="codigo_registro_funcionario"
            name="codigo_registro_funcionario"
            placeholder="Ex: 1234567"
            inputmode="numeric">
          <small class="field__hint">Número que vincula o funcionário ao CNES do estabelecimento</small>
        </div>

        <!-- CAMPO 4: Tipo de Funcionário -->
        <!-- Select com as 3 opções válidas do banco de dados.
             A primeira opção é um placeholder desabilitado que
             força o usuário a escolher antes de enviar. -->
        <div class="field">
          <label class="field__label" for="tipo_funcionario">Tipo de Funcionário</label>
          <select class="field__select" id="tipo_funcionario" name="tipo_funcionario" required>
            <option value="" disabled selected>Selecione o tipo…</option>
            <option value="Responsavel Hospital">Responsável Hospital</option>
            <option value="Responsavel Hemocentro">Responsável Hemocentro</option>
            <option value="Administrativo Hemocentro">Administrativo Hemocentro</option>
            <option value="Administrativo Hospital">Administrativo Hospital</option>
          </select>
        </div>

        <!-- CAMPO 5: Login do Funcionário (OCULTO)
             Este campo existe no banco de dados mas NÃO aparece
             no formulário. O valor será gerado ou tratado pelo
             sistema back-end (por exemplo, gerado automaticamente
             a partir do nome + código de registro). -->
        <input type="hidden" name="login_funcionario" value="">

        <!-- BOTÃO DE ENVIAR -->
        <button type="submit" class="btn">Cadastrar</button>
      </form>

      <!-- Mensagem de feedback (erro ou sucesso) — fica oculta por padrão -->
      <p class="msg" id="msg" hidden></p>
    </section>

  </main>

  <!-- base.js contém as funções reutilizadas em todas as páginas
       (enviarParaAPI, mostrarMensagem, ativarToggleSenha, etc.) -->
  <script src="../base.js"></script>
  <!-- cadastro-funcionario.js contém a lógica específica desta tela -->
  <script src="js/cadastro-funcionario.js"></script>

 

</body>
</html>
