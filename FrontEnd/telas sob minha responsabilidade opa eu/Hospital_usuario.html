<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta - Hospital Hemoglovida</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="css/usuario.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

</head>
<body>

  <header>
    <!--Título e logo-->
    <div class="header-left">
      <div class="logo">
        <img src="https://i.ibb.co/SwCGm0fj/Hemoglovida-Logo.png" alt="Logo Hemoglovida" class="logo-icon">
        Hemoglovida
      </div>

      <!--Links da navbar-->
      <nav>
        <a href="Hospital_estoque.html">Estoque</a>
        <a href="Hospital_pedidos.html">Pedidos</a>
      </nav>
    </div>

    <!--Ícone de usuário-->
    <div class="user">
      Bem-vindo, Dr. Gus Fring
      <div class="avatar">
        <img src="assets/avatar.jpg" alt="Foto de perfil">
      </div>
    </div>
  </header>


<main>
  <div class="profile-head">

    <div class="profile-photo">
      <img src="assets/avatar.jpg" alt="Foto de perfil" id="profileImg">
  </div>

  <div>
      <h1>Minha Conta</h1>
      <p class="profile-name">Dr. Gus Fring</p>
  </div>

  </div>

  <!-- DADOS PESSOAIS -->
  <section class="panel">
    <h2>Dados Pessoais</h2>
    
    <div class="grid-2">

      <div class="field">
        <label>Nome Completo</label>
        <input type="text" id="fullName" value="Gus Frings">
      </div>

      <div class="field">
        <label>Código de Registro</label>
        <input type="text" id="registrationCode" value="76489-SP">
      </div>

      <div class="field grid-span-2">

        <label>Cargo</label>
        <input type="text" id="role" value="Hemoterapeuta" disabled>

      </div>
      <div class="field">

        <label>E-mail</label>
        <div class="input-with-btn">

          <span class="ic"><i class="ph ph-envelope" aria-hidden="true"></i></span>
          <input type="email" id="emailField" value="gusfring@cps.professor.sp.kirk" disabled>
          <button class="btn-alterar" data-target="emailField">Alterar</button>

        </div>
      </div>
      <div class="field">

        <label>Telefone</label>
        <div class="input-with-btn">
          <span class="ic"><i class="ph ph-phone" aria-hidden="true"></i></span>
          <input type="text" id="phoneField" value="(11) 96753-2015" disabled>
          <button class="btn-alterar" data-target="phoneField">Alterar</button>

        </div>
      </div>
    </div>
  </section>

  <!-- SENHA -->
  <section class="panel">
    <h2>Senha</h2>
    <div class="field">

      <label>Senha</label>

      <div class="input-with-btn">

        <input type="password" value="senha1234" id="passwordField">
        <span class="hint">Última alteração há 45 dias</span>
        <button class="btn-solid" id="changePasswordBtn">Alterar Senha</button>

      </div>
    </div>
  </section>

  <div class="bottom-actions">

    <button class="btn-solid" id="saveBtn">Salvar Alterações</button>
    <button class="btn-outline-danger" id="deleteAccountBtn">⊘ Encerrar Conta</button>

  </div>
</main>


<!-- MODAL ALTERAR SENHA -->

<div class="overlay" id="passwordOverlay">

  <div class="modal">

    <button class="close" id="passwordClose">✕</button>
    <h2>Alterar Senha</h2>

    <div class="field">
      <label>Senha atual</label>
      <input type="password" id="currentPass" placeholder="Digite sua senha atual">
    </div>

    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="newPass" placeholder="Digite a nova senha">
    </div>

    <div class="field">
      <label>Confirmar nova senha</label>
      <input type="password" id="confirmPass" placeholder="Repita a nova senha">
    </div>

    <button class="btn-solid full" id="savePasswordBtn">Salvar Nova Senha</button>
  </div>
</div>

<!-- MODAL ENCERRAR CONTA -->
<div class="overlay" id="deleteOverlay">

  <div class="modal">

    <button class="close" id="deleteClose">✕</button>

    <div class="modal-icon"><i class="ph ph-warning-circle" aria-hidden="true"></i></div>

    <h2>Encerrar Conta</h2>

    <p class="modal-text">Essa ação é permanente e removerá seu acesso ao painel do hemocentro. Tem certeza que deseja continuar?</p>

    <div class="modal-actions">

      <button class="modal-btn-outline" id="cancelDelete">Cancelar</button>
      <button class="btn-danger" id="confirmDelete">Sim, encerrar conta</button>

    </div>
  </div>
</div>


<script src="base.js"></script>
<script src="js/usuario.js"></script>

</body>
</html>
