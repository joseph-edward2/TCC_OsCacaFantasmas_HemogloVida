<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemoglovida | Hemocentro</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <!--Título e logo-->
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="Logo Hemoglovida" class="logo-icon">
        Hemoglovida
      </div>
    </div>
  </header>

  <!-- Corpo -->
  <main class="page">

    <!-- Bloco de identidade -->
    <section class="hero">
      <div class="hero__row">
        <div class="hero__badge">
          <img class="hero__logo" src="../assets/logo.png" alt="Logo Hemoglovida">
        </div>
        <h1 class="hero__name">Hemoglovida</h1>
      </div>
      <h2 class="hero__subtitle">Hemocentro</h2>
    </section>

    <!-- Cartão de login -->
    <section class="card">
      <form id="loginForm" method="POST" novalidate>
        <div class="field">
          <label class="field__label" for="login">Login</label>
          <input
            class="field__input"
            type="text"
            id="login"
            name="login"
            placeholder="00.000.000/0001-00"
            autocomplete="username"
            maxlength="18"
            inputmode="numeric">
        </div>

        <div class="field">
          <label class="field__label" for="senha">Senha</label>
          <div class="field__wrapper">
            <input
              class="field__input field__input--password"
              type="password"
              id="senha"
              name="senha"
              placeholder="••••••••"
              autocomplete="current-password">
            <button type="button" class="field__toggle" id="toggleSenha" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>

      <p class="msg" id="msg" hidden></p>
    </section>

  </main>

  <script src="../base.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
